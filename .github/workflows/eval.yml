name: DevOps Agent Tests and Report

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: make test

      - name: Offline eval (golden set + groundedness)
        run: make eval

      - name: Report is current (synthetic dataset)
        run: make report-check
