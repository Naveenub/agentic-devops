name: DevOps Agent Tests and Report

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly: live-model accuracy drifts when the provider changes the model

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r product/requirements.txt

      - name: MIN_REAL ratchet cannot be lowered
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          base=$(git show "origin/${{ github.base_ref }}:data/eval/real/MIN_REAL" 2>/dev/null || echo 0)
          head=$(cat data/eval/real/MIN_REAL)
          test "$head" -ge "$base" || { echo "MIN_REAL lowered: $base -> $head"; exit 1; }

      - name: Unit tests
        run: make test

      - name: Offline eval (golden set + groundedness)
        run: make eval

      - name: Report is current (synthetic dataset)
        run: make report-check

  live-eval:
    # Live model over golden + real cases, plus the per-claim entailment judge. Needs the OPENAI_API_KEY
    # repo secret; skipped on forks/PRs where secrets are unavailable. Offline `test` job does not cover this.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require the secret (a skipped live eval must not look like a pass)
        run: test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY secret not set"; exit 1; }

      - name: Live eval + groundedness judge
        run: make live-eval   # smoke on golden cases; `make accuracy-claim` is the real-incident gate

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r product/requirements.txt

      - name: Product tests on PostgreSQL
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q tests/test_product.py tests/test_product_scale.py tests/test_stripe_sync.py
