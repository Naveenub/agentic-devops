services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    volumes:
      - chroma-data:/data/chroma
      # Commercial layer (see LICENSING.md): build with `make image-product`, set `image:` to
      # agentic-devops-product instead of `build: .`, set PRODUCT_DB=/data/product/product.db in .env,
      # and persist the database:
      # - product-data:/data/product

volumes:
  chroma-data:
  # product-data:
